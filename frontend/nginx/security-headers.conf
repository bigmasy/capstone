# Included in every location that adds its own headers: add_header directives are not
# inherited by a location that has any add_header of its own.
#
# script-src is 'self' only, so an injected inline script does not run; the build emits no
# inline scripts. style-src allows inline styles because react-hot-toast injects a <style>
# element at runtime and the map library positions its panes with inline styles; styles cannot
# execute code. connect-src 'self' matches the API, which is served from the same origin behind
# the reverse proxy.
#
# The location picker loads OpenStreetMap raster tiles, so img-src names that one host. This is a
# deliberate, documented privacy trade-off: the tile server sees which part of the map is viewed
# (and the IP address and the origin of this site), never the point chosen or any profile data.
# The tile usage policy asks for a Referer, hence strict-origin-when-cross-origin: only the origin
# of this site, never a path or query, leaves the page. The API responses keep no-referrer.
# geolocation=(self) lets the "use my location" button work on this origin only; the position is
# read in the browser and never sent anywhere except as the rounded area on save.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
