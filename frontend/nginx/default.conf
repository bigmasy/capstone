# Static server for the built single-page application (listens on 8080 as an unprivileged user).
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Only reads are meaningful here.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build output never changes under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # History fallback: any path that is not a file is a client-side route.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # A missing API path must not be answered with the application shell.
    location /api/ {
        return 404;
    }
}
