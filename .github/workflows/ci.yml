name: ci

on:
  push:
  pull_request:
  # Runs the checks (and, on main, the deploy) again by hand, for example to redeploy a commit
  workflow_dispatch:
  schedule:
    # Weekly, so that advisories published after the last push still fail the audit job
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # NumPy and LightGBM are installed too, so that mypy sees the types of the ranking code
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: lint-imports

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The ML requirements are installed so that the ranking and experiment tests run instead
      # of being skipped; a guard test fails when LightGBM is missing while CI is set.
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: pytest -q
      - name: Experiment smoke runs write valid JSON
        run: |
          python -m app.experiment h1 --config smoke --out "$RUNNER_TEMP/h1.json"
          python -m app.experiment h2 --config smoke --out "$RUNNER_TEMP/h2.json"
          python -m json.tool "$RUNNER_TEMP/h1.json" > /dev/null
          python -m json.tool "$RUNNER_TEMP/h2.json" > /dev/null
      - name: The ranker trains and exports an artifact
        run: |
          python -m app.experiment train --config smoke --out "$RUNNER_TEMP/model"
          test -s "$RUNNER_TEMP/model/model.txt"
          python -m json.tool "$RUNNER_TEMP/model/manifest.json" > /dev/null

  postgis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adaptive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adaptive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throw-away credentials of the service container above
      ENV: test
      JWT_SECRET: ci-only-signing-key-0123456789abcdef
      DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/adaptive_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/adaptive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrate to head
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check
      - name: PostGIS tests
        run: pytest -q -m postgis

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-dev.txt
      - run: pip-audit -r requirements-ranker.txt
      - run: pip-audit -r requirements-ml.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build --tag adaptive-sport-backend:ci backend
      # The repository root is the build context: the image needs docs/api/openapi.json
      - name: Build the frontend image
        run: docker build --file frontend/Dockerfile --tag adaptive-sport-frontend:ci .
      - name: Build the proxy and the certificate generator
        run: |
          docker build --target proxy --tag adaptive-sport-proxy:ci docker/proxy
          docker build --target certs --tag adaptive-sport-certs:ci docker/proxy
      - name: Compose file is valid
        env:
          # Placeholders: compose refuses to render without the mandatory secrets
          POSTGRES_PASSWORD: ci
          DB_OWNER_PASSWORD: ci
          DB_API_PASSWORD: ci
          JWT_SECRET: ci-only-signing-key-0123456789abcdef
          SEED_PASSWORD: ci-only-demo-password
        run: docker compose --profile demo config --quiet

  stack:
    runs-on: ubuntu-latest
    env:
      # Shared by compose and the smoke script, which looks the containers up by project
      COMPOSE_PROJECT_NAME: adaptive-ci
    steps:
      - uses: actions/checkout@v4
      - name: Generate throw-away secrets
        run: |
          for name in POSTGRES_PASSWORD DB_OWNER_PASSWORD DB_API_PASSWORD SEED_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "JWT_SECRET=$value" >> "$GITHUB_ENV"
      - name: Start the stack with the demo data
        run: docker compose --profile demo up --build --detach --wait
      # Also checks that the feed is ordered by the learned ranker (the demo accounts exist)
      - name: Smoke test through the proxy
        run: docker/smoke.sh
      # Empties the model volume, expects the baseline order, trains again and expects the
      # learned order; the login rate limit left by the smoke test refills while it retries
      - name: Ranker fallback
        run: docker/smoke.sh --fallback
      - name: Show the logs when something failed
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 80
      - name: Tear down
        if: always()
        run: docker compose --profile demo down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Satisfies the "engines" range in frontend/package.json
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The generated API types exist only once the backend has exported the contract
      - name: Generate API types
        if: ${{ hashFiles('docs/api/openapi.json') != '' }}
        run: npm run gen:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: adaptive-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Generate throw-away secrets
        run: |
          for name in POSTGRES_PASSWORD DB_OWNER_PASSWORD DB_API_PASSWORD SEED_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "JWT_SECRET=$value" >> "$GITHUB_ENV"
          value="Aa1-$(openssl rand -hex 12)"
          echo "::add-mask::$value"
          echo "E2E_PASSWORD=$value" >> "$GITHUB_ENV"
      - name: Start the stack with the demo data
        run: docker compose --profile demo up --build --detach --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the dependencies and the generated API types
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api
      # Chromium and its system libraries stay on the runner; nothing of this goes into an image
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost:8443
          E2E_DEMO_PASSWORD: ${{ env.SEED_PASSWORD }}
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Show the logs when something failed
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 80
      - name: Tear down
        if: always()
        run: docker compose --profile demo down --volumes

  # Continuous deployment. Runs only for a push to main, and only when every job above passed.
  # It builds the four images once, publishes them to the GitHub container registry under the
  # commit hash, and tells the server to switch to them (deploy/remote.sh: database dump, pull,
  # start, wait for the health checks, roll back on failure). The server holds no source code and
  # builds nothing. Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in
  # the "production" environment; its variable SITE_URL is the public address. docs/deployment.md
  # describes the one-time setup.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, postgis, audit, docker, stack, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    # One deploy at a time; a newer push waits instead of cancelling a release halfway through
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Name the images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "BACKEND_IMAGE=$prefix/backend:$GITHUB_SHA"
            echo "FRONTEND_IMAGE=$prefix/frontend:$GITHUB_SHA"
            echo "PROXY_IMAGE=$prefix/proxy:$GITHUB_SHA"
            echo "CERTS_IMAGE=$prefix/certs:$GITHUB_SHA"
          } | tee images.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      # The repository root is the build context: the image needs docs/api/openapi.json
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Proxy image
        uses: docker/build-push-action@v6
        with:
          context: docker/proxy
          target: proxy
          push: true
          tags: ${{ env.PROXY_IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max
      - name: Certificate generator image
        uses: docker/build-push-action@v6
        with:
          context: docker/proxy
          target: certs
          push: true
          tags: ${{ env.CERTS_IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=certs
          cache-to: type=gha,scope=certs,mode=max
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The server accepts one command for this key (deploy/poruch-deploy). The release goes over
      # standard input as an archive; the token is the short-lived one of this run and is read
      # by the server only to pull the images.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stage="$(mktemp -d)"
          mkdir -p "$stage/deploy"
          cp docker-compose.yml "$stage/"
          cp -r docker "$stage/docker"
          rm -f "$stage/docker/smoke.sh"
          cp deploy/remote.sh "$stage/deploy/"
          cp images.env "$stage/images.env"
          printf '%s' "$GITHUB_ACTOR" > "$stage/registry.user"
          printf '%s' "$REGISTRY_TOKEN" > "$stage/registry.token"
          tar -czf - -C "$stage" . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      # What a visitor gets, through the public address and the certificate that Caddy serves
      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "$SITE_URL/ready" > /dev/null
          curl --fail --silent --show-error "$SITE_URL/" | grep -q '<div id="root">'
          curl --fail --silent --show-error "$SITE_URL/api/v1/news" > /dev/null
